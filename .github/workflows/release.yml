name: Build Windows installer

# Push a tag like "v1.0.1" (matching desktop/package.json's "version") to
# build the Windows 10/11 installer and publish it as a GitHub Release.
# Any other trigger (manual dispatch, or a push to main) just builds and
# uploads the .exe as a workflow artifact, without publishing a release.
on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm run install:all

      - name: Build frontend
        working-directory: client
        run: npm run build

      # Kept even though it turned out not to be the cause (see the note
      # on the build step below) - it's still a reasonable, harmless
      # speedup to leave in place. pwsh (PowerShell 7), not the default
      # "powershell" (5.1) alias, since 5.1 choked on a non-ASCII dash
      # character in an earlier version of this script with a confusing,
      # misattributed parse error.
      - name: Disable or exclude from Windows Defender scanning
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          $status = Get-MpComputerStatus
          Write-Host "RealTimeProtectionEnabled: $($status.RealTimeProtectionEnabled)"
          if ($status.RealTimeProtectionEnabled) {
            Write-Host "Real-time protection still on (Tamper Protection likely blocked the disable) - adding exclusion paths instead."
          }
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\electron-builder\Cache"
          Add-MpPreference -ExclusionPath "$env:TEMP"
          Add-MpPreference -ExclusionProcess "7za.exe"
          Add-MpPreference -ExclusionProcess "makensis.exe"
          Add-MpPreference -ExclusionProcess "signtool.exe"
          Add-MpPreference -ExclusionProcess "app-builder.exe"

      # Decide publish-vs-build-only from the Actions-provided $GITHUB_REF
      # directly, rather than electron-builder's own "onTag" policy, which
      # inspects local git tag refs — those aren't present on the default
      # shallow, tag-less checkout.
      #
      # This step's compression of the ~320MB unpacked Electron app into
      # the NSIS payload (a single-threaded LZMA pass by design — see the
      # -mtc/-ms/-mtm/-mta=off flags in its own DEBUG output) takes ~25s
      # on a normal dev machine but has taken 30+ minutes here across
      # several runs. Ruled out so far: an ASCII product name, disabling
      # Defender, CSC_IDENTITY_AUTO_DISCOVERY, pinning windows-2022 over
      # windows-latest, and verified Defender exclusion paths/processes —
      # none of it made a measurable difference, so this really is just
      # how long a 2-vCPU GH-hosted runner takes for this specific,
      # forced-single-threaded operation. It does eventually finish, so a
      # generous timeout (not a fix, just patience) is the honest answer
      # until there's a real lever to pull — e.g. dropping the payload
      # size significantly, or moving off NSIS's default packaging.
      - name: Build Windows installer
        working-directory: desktop
        shell: bash
        timeout-minutes: 60
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            npx electron-builder --win --publish always
          else
            npx electron-builder --win --publish never
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          DEBUG: electron-builder

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: desktop/release/*.exe
