name: Build Windows installer

# Push a tag like "v1.0.1" (matching desktop/package.json's "version") to
# build the Windows 10/11 installer and publish it as a GitHub Release.
# Any other trigger (manual dispatch, or a push to main) just builds and
# uploads the .exe as a workflow artifact, without publishing a release.
on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm run install:all

      - name: Build frontend
        working-directory: client
        run: npm run build

      # Windows Defender's real-time scan of every file NSIS/signtool
      # touches is a well-known cause of electron-builder hanging for a
      # very long time (sometimes indefinitely) on GitHub-hosted Windows
      # runners specifically — it doesn't happen on a normal dev machine.
      - name: Disable Windows Defender real-time scanning
        shell: powershell
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      # Decide publish-vs-build-only from the Actions-provided $GITHUB_REF
      # directly, rather than electron-builder's own "onTag" policy, which
      # inspects local git tag refs — those aren't present on the default
      # shallow, tag-less checkout and can stall trying to resolve them.
      - name: Build Windows installer
        working-directory: desktop
        shell: bash
        timeout-minutes: 12
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            npx electron-builder --win --publish always
          else
            npx electron-builder --win --publish never
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: desktop/release/*.exe
