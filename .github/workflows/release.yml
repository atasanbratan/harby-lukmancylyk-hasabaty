name: Build Windows installer

# Push a tag like "v1.0.1" (matching desktop/package.json's "version") to
# build the Windows 10/11 installer and publish it as a GitHub Release.
# Any other trigger (manual dispatch, or a push to main) just builds and
# uploads the .exe as a workflow artifact, without publishing a release.
on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm run install:all

      - name: Build frontend
        working-directory: client
        run: npm run build

      # Best-effort speedup; harmless either way.
      - name: Disable Windows Defender real-time scanning
        shell: powershell
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      # Decide publish-vs-build-only from the Actions-provided $GITHUB_REF
      # directly, rather than electron-builder's own "onTag" policy, which
      # inspects local git tag refs — those aren't present on the default
      # shallow, tag-less checkout.
      #
      # timeout-minutes / DEBUG: with DEBUG=electron-builder on, what first
      # looked like an indefinite hang turned out to be silent, genuine
      # work — 7za.exe compressing the whole win-unpacked Electron bundle
      # into the NSIS payload at a fixed -mx=9 (that specific step isn't
      # controlled by the top-level "compression" build option, confirmed
      # by it still showing -mx=9 with that set to "normal"). It's just
      # far slower on GH's 2-vCPU runners than on a real dev machine —
      # trimming Electron's own unused locale files in desktop/package.json
      # shrinks the payload a little, but the timeout is set generously
      # to cover the rest since there's no further lever on this step.
      - name: Build Windows installer
        working-directory: desktop
        shell: bash
        timeout-minutes: 30
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            npx electron-builder --win --publish always
          else
            npx electron-builder --win --publish never
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          DEBUG: electron-builder

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: desktop/release/*.exe
